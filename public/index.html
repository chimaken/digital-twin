<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Twin</title>
  <script src="config.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; }
    label { display: block; margin-bottom: 0.25rem; font-weight: 500; }
    input, button { font-size: 1rem; padding: 0.5rem 0.75rem; }
    input { width: 100%; margin-bottom: 0.75rem; }
    button { cursor: pointer; background: #111; color: #fff; border: none; border-radius: 4px; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #answer { margin-top: 1rem; padding: 1rem; background: #f5f5f5; border-radius: 6px; white-space: pre-wrap; min-height: 2em; }
    #answer.error { background: #fee; color: #c00; }
    #answer:empty::before { content: 'Answer will appear here'; color: #999; }
  </style>
</head>
<body>
  <h1>Digital Twin</h1>
  <p>Ask a question. Answers come from the CV (RAG) or from web research.</p>
  <form id="form">
    <label for="question">Question</label>
    <input type="text" id="question" name="question" placeholder="e.g. What is Chimobi's email?" required>
    <button type="submit" id="btn">Ask</button>
  </form>
  <div id="answer"></div>
  <p id="source" style="font-size:0.85rem;color:#666;margin-top:0.5rem;"></p>
  <script>
    const form = document.getElementById('form');
    const question = document.getElementById('question');
    const btn = document.getElementById('btn');
    const answerEl = document.getElementById('answer');
    const sourceEl = document.getElementById('source');
    const apiBase = (window.API_BASE_URL || '').replace(/\/$/, '');
    const askUrl = apiBase + '/api/ask';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = (question.value || '').trim();
      if (!q) return;
      btn.disabled = true;
      answerEl.textContent = '…';
      answerEl.classList.remove('error');
      sourceEl.textContent = '';
      try {
        const res = await fetch(askUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q }),
        });
        const data = await res.json();
        if (!res.ok) {
          answerEl.textContent = data.error || data.message || res.statusText;
          answerEl.classList.add('error');
        } else {
          answerEl.textContent = data.answer || '(no answer)';
          if (data.source) sourceEl.textContent = 'Source: ' + (data.source === 'cv' ? 'CV (RAG)' : 'Web research');
        }
      } catch (err) {
        answerEl.textContent = 'Error: ' + err.message;
        answerEl.classList.add('error');
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
